name: CI

# Runs on every PR into dev/main and on direct pushes to them, so a PR cannot merge with a red build.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, so CI matches local.
      - run: npm ci

      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
      # Production deps only, high/critical only: keeps the signal useful.
      - run: npm audit --omit=dev --audit-level=high
